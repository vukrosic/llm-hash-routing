<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect x="0" y="0" width="900" height="300" fill="#fff"/>
<!-- panel a -->
<rect x="5" y="5" width="290" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/>
<text x="150" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">A word cannot be split</text>
<text x="150" y="56" text-anchor="middle" fill="#555">work per expert, fixed table</text>
<line x1="30" y1="220" x2="270" y2="220" stroke="#888"/>
<rect x="40" y="186" width="18" height="34" fill="#4a7fc1"/>
<rect x="62" y="180" width="18" height="40" fill="#4a7fc1"/>
<rect x="84" y="90" width="18" height="130" fill="#d9822b"/>
<rect x="106" y="184" width="18" height="36" fill="#4a7fc1"/>
<rect x="128" y="190" width="18" height="30" fill="#4a7fc1"/>
<rect x="150" y="182" width="18" height="38" fill="#4a7fc1"/>
<rect x="172" y="140" width="18" height="80" fill="#d9822b"/>
<rect x="194" y="186" width="18" height="34" fill="#4a7fc1"/>
<rect x="216" y="188" width="18" height="32" fill="#4a7fc1"/>
<rect x="238" y="183" width="18" height="37" fill="#4a7fc1"/>
<line x1="34" y1="178" x2="266" y2="178" stroke="#444" stroke-dasharray="5,4"/>
<text x="266" y="172" text-anchor="end" fill="#444" font-size="12">average</text>
<text x="93" y="82" text-anchor="middle" fill="#d9822b" font-weight="bold">“the”</text>
<text x="181" y="132" text-anchor="middle" fill="#d9822b" font-weight="bold">“,”</text>
<text x="150" y="250" text-anchor="middle" fill="#555">every use of a word goes to its row</text>
<text x="150" y="272" text-anchor="middle" fill="#c0504d" font-weight="bold">common words make busy experts</text>
<!-- panel b -->
<rect x="305" y="5" width="290" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/>
<text x="450" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">Busiest expert ÷ average</text>
<line x1="340" y1="220" x2="575" y2="220" stroke="#888"/>
<line x1="340" y1="220" x2="340" y2="62" stroke="#888"/>
<polyline points="340,200 400,200 575,80" fill="none" stroke="#4c9a5a" stroke-width="3"/>
<circle cx="370" cy="200" r="5" fill="#4c9a5a"/><circle cx="430" cy="180" r="5" fill="#4c9a5a"/><circle cx="490" cy="138" r="5" fill="#4c9a5a"/><circle cx="560" cy="90" r="5" fill="#4c9a5a"/>
<circle cx="370" cy="186" r="5" fill="none" stroke="#c0504d" stroke-width="2"/><circle cx="430" cy="140" r="5" fill="none" stroke="#c0504d" stroke-width="2"/><circle cx="490" cy="104" r="5" fill="none" stroke="#c0504d" stroke-width="2"/><circle cx="560" cy="76" r="5" fill="none" stroke="#c0504d" stroke-width="2"/>
<line x1="400" y1="200" x2="400" y2="226" stroke="#444" stroke-dasharray="3,3"/>
<text x="400" y="240" text-anchor="middle" fill="#444" font-size="12">26</text>
<text x="458" y="262" text-anchor="middle" fill="#555">experts per chosen expert (E/k)</text>
<text x="332" y="204" text-anchor="end" fill="#555" font-size="12">1</text>
<circle cx="352" cy="76" r="5" fill="#4c9a5a"/><text x="362" y="80" fill="#555" font-size="12">balanced table</text>
<circle cx="352" cy="96" r="5" fill="none" stroke="#c0504d" stroke-width="2"/><text x="362" y="100" fill="#555" font-size="12">random table</text>
<text x="585" y="190" text-anchor="end" fill="#2e7d32" font-size="12" font-weight="bold">line = share of “the” × E/k</text>
<text x="450" y="284" text-anchor="middle" fill="#c0504d" font-weight="bold">past 26, no table can balance</text>
<!-- panel c -->
<rect x="605" y="5" width="290" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/>
<text x="750" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">Only the ratio E/k matters</text>
<text x="750" y="56" text-anchor="middle" fill="#555">busiest ÷ average, balanced table</text>
<line x1="630" y1="210" x2="870" y2="210" stroke="#888"/>
<rect x="650" y="120" width="44" height="90" fill="#d9822b"/>
<rect x="728" y="120" width="44" height="90" fill="#d9822b"/>
<rect x="806" y="120" width="44" height="90" fill="#d9822b"/>
<line x1="640" y1="120" x2="860" y2="120" stroke="#444" stroke-dasharray="5,4"/>
<text x="672" y="230" text-anchor="middle" fill="#555">64 of 1</text>
<text x="750" y="230" text-anchor="middle" fill="#555">128 of 2</text>
<text x="828" y="230" text-anchor="middle" fill="#555">384 of 6</text>
<text x="750" y="260" text-anchor="middle" fill="#555">experts, chosen per word</text>
<text x="750" y="282" text-anchor="middle" fill="#2e7d32" font-weight="bold">same ratio, same busiest expert</text>
</svg>
