<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs>
<rect x="5" y="5" width="270" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/><text x="140.0" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">Force a table to move words</text>
<text x="140" y="58" text-anchor="middle" fill="#555">extra loss, by share of words moved</text><line x1="35" y1="210" x2="245" y2="210" stroke="#888"/>
<rect x="50" y="207" width="40" height="3" fill="#d9822b"/><text x="70" y="228" text-anchor="middle" fill="#555">none</text>
<rect x="120" y="180" width="40" height="30" fill="#d9822b"/><text x="140" y="228" text-anchor="middle" fill="#555">10%</text>
<rect x="190" y="78" width="40" height="132" fill="#d9822b"/><text x="210" y="228" text-anchor="middle" fill="#555">50%</text>
<text x="140" y="268" text-anchor="middle" fill="#c0504d" font-weight="bold">more moves, more loss</text>
<rect x="285" y="5" width="270" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/><text x="420.0" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">A frozen router moves too</text>
<text x="420" y="58" text-anchor="middle" fill="#555">how often words move</text><line x1="315" y1="210" x2="525" y2="210" stroke="#888"/>
<rect x="330" y="90" width="40" height="120" fill="#7a5bb5"/><text x="350" y="228" text-anchor="middle" fill="#555">learning</text>
<rect x="400" y="92" width="40" height="118" fill="#7a5bb5"/><text x="420" y="228" text-anchor="middle" fill="#555">frozen</text>
<rect x="470" y="208" width="40" height="2" fill="#7a5bb5"/><text x="490" y="228" text-anchor="middle" fill="#555">table</text>
<text x="420" y="268" text-anchor="middle" fill="#c0504d" font-weight="bold">moves without router learning</text>
<rect x="565" y="5" width="330" height="290" rx="12" fill="#fafafa" stroke="#d0d0d0"/><text x="730.0" y="34" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">Why: the router’s input changes</text>
<text x="580" y="104" fill="#555">step 50</text><rect x="642" y="80" width="82" height="38" rx="7" fill="#dbe8f7" stroke="#4a7fc1" stroke-width="1.5"/><text x="683" y="104" text-anchor="middle">h of “cat”</text><line x1="726" y1="99" x2="746" y2="99" stroke="#444" stroke-width="1.5" marker-end="url(#k)"/><rect x="748" y="80" width="58" height="38" rx="7" fill="#e9e1f5" stroke="#7a5bb5" stroke-width="1.5"/><text x="777" y="104" text-anchor="middle">router</text><line x1="808" y1="99" x2="818" y2="99" stroke="#444" stroke-width="1.5" marker-end="url(#k)"/><rect x="820" y="80" width="64" height="38" rx="7" fill="#fbe3c8" stroke="#d9822b" stroke-width="1.5"/><text x="852" y="104" text-anchor="middle">expert 2</text>
<text x="580" y="199" fill="#555">step 150</text><rect x="642" y="175" width="82" height="38" rx="7" fill="#a9c6ea" stroke="#4a7fc1" stroke-width="1.5"/><text x="683" y="199" text-anchor="middle">h changed</text><line x1="726" y1="194" x2="746" y2="194" stroke="#444" stroke-width="1.5" marker-end="url(#k)"/><rect x="748" y="175" width="58" height="38" rx="7" fill="#e9e1f5" stroke="#7a5bb5" stroke-width="1.5"/><text x="777" y="199" text-anchor="middle">router</text><line x1="808" y1="194" x2="818" y2="194" stroke="#444" stroke-width="1.5" marker-end="url(#k)"/><rect x="820" y="175" width="64" height="38" rx="7" fill="#fbe3c8" stroke="#d9822b" stroke-width="1.5"/><text x="852" y="199" text-anchor="middle">expert 5</text>
<text x="777" y="143" text-anchor="middle" fill="#7a5bb5" font-size="12">same weights</text><line x1="777" y1="122" x2="777" y2="130" stroke="#7a5bb5"/><line x1="777" y1="149" x2="777" y2="171" stroke="#7a5bb5"/>
<text x="730" y="250" text-anchor="middle" fill="#555">attention and earlier layers train,</text><text x="730" y="268" text-anchor="middle" fill="#c0504d" font-weight="bold">so the same word scores differently</text>
</svg>
